<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ringlight Burst</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        background: #000;
      }

      .stack {
        position: relative;
        width: 100vmin;
        height: 100vmin;
        display: grid;
        place-items: center;
      }

      .burst {
        position: absolute;
        width: var(--s);
        height: var(--s);
        background: var(--c);
        filter: blur(var(--b));
      }

      .burst::before,
      .burst::after {
        content: "";
        position: absolute;
        inset: 0;
        background: inherit;
      }

      .burst::before {
        transform: rotate(30deg);
      }

      .burst::after {
        transform: rotate(60deg);
      }

      @keyframes spinPulse {
        0% {
          transform: rotate(0deg) scale(1);
        }
        50% {
          transform: rotate(180deg) scale(1.3);
        }
        100% {
          transform: rotate(360deg) scale(1);
        }
      }

      @keyframes warmCool {
        0% {
          filter: blur(var(--b)) hue-rotate(0deg);
        }
        50% {
          filter: blur(var(--b)) hue-rotate(-25deg);
        }
        100% {
          filter: blur(var(--b)) hue-rotate(0deg);
        }
      }

      .outer {
        --s: 130vmin;
        --c: #ffae00;
        --b: 196px;
        animation:
          spinPulse 120s linear infinite,
          warmCool 20s ease-in-out infinite;
      }

      .main {
        --s: 60vmin;
        --c: #ffffff;
        --b: 88px;
        animation:
          spinPulse 60s linear infinite reverse,
          warmCool 12s ease-in-out infinite;
      }

      .inner {
        --s: 30vmin;
        --c: #b84900;
        --b: 64px;
        animation:
          spinPulse 45s linear infinite,
          warmCool 8s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .burst {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="stack">
      <div class="burst outer"></div>
      <div class="burst main"></div>
      <div class="burst inner"></div>
    </div>
  </body>
</html>
